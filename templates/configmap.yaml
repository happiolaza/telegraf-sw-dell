apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "telegraf-site.fullname" . }}-config
  labels:
    {{- include "telegraf-site.labels" . | nindent 4 }}
data:
  telegraf.conf: |
    [global_tags]
      site = "{{ .Values.site.name }}"
      {{- if .Values.site.vendor }}
      vendor = "{{ .Values.site.vendor }}"
      {{- end }}

    [agent]
      interval = "{{ .Values.snmp.interval | default "60s" }}"
      round_interval = {{ .Values.telegraf.agent.roundInterval | default false }}
      metric_batch_size = {{ .Values.telegraf.agent.metricBatchSize | default 5000 }}
      metric_buffer_limit = {{ .Values.telegraf.agent.metricBufferLimit | default 50000 }}
      collection_jitter = "{{ .Values.telegraf.agent.collectionJitter | default "1s" }}"
      flush_interval = "{{ .Values.telegraf.agent.flushInterval | default "15s" }}"
      flush_jitter = "{{ .Values.telegraf.agent.flushJitter | default "2s" }}"
      precision = "{{ .Values.telegraf.agent.precision | default "1s" }}"
      hostname = ""
      omit_hostname = {{ .Values.telegraf.agent.omitHostname | default false }}

    ###############################################################################
    #                            OUTPUT PLUGINS                                   #
    ###############################################################################

    [[outputs.prometheus_client]]
      listen = ":{{ include "telegraf-site.prometheusPort" . }}"
      metric_version = {{ .Values.telegraf.output.metricVersion | default 1 }}

    ###############################################################################
    #                            INPUT PLUGINS                                    #
    ###############################################################################

    [[inputs.snmp]]
      name = "{{ .Values.site.name }}"
      agents = [
        {{- range .Values.snmp.agents }}
        "udp://{{ . }}:161",
        {{- end }}
      ]
      version = {{ .Values.snmp.version | default 2 }}
      community = "{{ .Values.snmp.community }}"
      path = ["{{ include "telegraf-site.mibMountPath" . }}"]
      interval = "{{ .Values.snmp.interval | default "60s" }}"

      {{- range .Values.snmp.tables }}
      {{- if .field }}
      [[inputs.snmp.field]]
        oid = "{{ .oid }}"
        name = "{{ .name }}"
        {{- if .is_tag }}
        is_tag = true
        {{- end }}
      {{- else }}
      [[inputs.snmp.table]]
        oid = "{{ .oid }}"
        {{- if .name }}
        name = "{{ .name }}"
        {{- end }}
        inherit_tags = [{{ $.Values.snmp.deviceTagName | default "device" | quote }}]
        {{- range .fields }}
        [[inputs.snmp.table.field]]
          oid = "{{ .oid }}"
          name = "{{ .name }}"
          {{- if .is_tag }}
          is_tag = true
          {{- end }}
        {{- end }}
      {{- end }}
      {{- end }}
