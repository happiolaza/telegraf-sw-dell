# Configuracion para agregar al ConfigMap "prometehus-config" en namespace "grafana-operaciones"
#
# Los Services ClusterIP se resuelven cross-namespace via DNS interno.
#
# Aplicar con:
#   kubectl edit configmap prometehus-config -n grafana-operaciones
#   # Luego reiniciar Prometheus:
#   kubectl rollout restart deployment prometheus -n grafana-operaciones

scrape_configs:
  # --- Cuyo ---
  - job_name: 'telegraf-sw-cuyo'
    scrape_interval: 30s
    metrics_path: /metrics
    static_configs:
    - targets: ['telegraf-cuyo.telegraf-sw-dell.svc.cluster.local:9273']
    relabel_configs:
    - target_label: site
      replacement: cuyo

  # --- Republica ---
  - job_name: 'telegraf-sw-republica'
    scrape_interval: 30s
    metrics_path: /metrics
    static_configs:
    - targets: ['telegraf-republica.telegraf-sw-dell.svc.cluster.local:9273']
    relabel_configs:
    - target_label: site
      replacement: republica

  # --- Barracas ---
  - job_name: 'telegraf-sw-barracas'
    scrape_interval: 30s
    metrics_path: /metrics
    static_configs:
    - targets: ['telegraf-barracas.telegraf-sw-dell.svc.cluster.local:9273']
    relabel_configs:
    - target_label: site
      replacement: barracas
